<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FigForge · 科研制图台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════════ 顶部工具栏 ══════════════ -->
<header class="toolbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <rect x="2.5" y="12.5" width="4" height="9" rx="0.6" fill="currentColor" opacity=".45"/>
      <rect x="9" y="7" width="4" height="14.5" rx="0.6" fill="currentColor" opacity=".7"/>
      <rect x="15.5" y="3" width="4" height="18.5" rx="0.6" fill="currentColor"/>
    </svg>
    <span class="brand-name">FigForge</span>
    <span class="brand-sub">科研制图台</span>
  </div>

  <!-- 窄屏（≤1023px）时左右面板变为抽屉，用这两个按钮拉起 -->
  <div class="tb-btnbar tb-view">
    <button class="icon-btn" id="btn-view-left" title="数据表" aria-label="数据表">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="1.4"/><path d="M3 8h14M8.5 8v8"/></svg>
    </button>
    <button class="icon-btn" id="btn-view-right" title="属性面板" aria-label="属性面板">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/><circle cx="8" cy="6" r="1.7" fill="currentColor" stroke="none"/><circle cx="13" cy="10" r="1.7" fill="currentColor" stroke="none"/><circle cx="7" cy="14" r="1.7" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="tb-sep"></div>

  <!-- 图表类型 -->
  <div class="tb-field tb-charttype">
    <label>图形</label>
    <button class="dropdown-btn" id="btn-charttype" type="button">
      <span class="dc-icon" id="ct-icon"></span>
      <span id="ct-label">柱状图</span>
      <svg class="chev" viewBox="0 0 12 12" width="10" height="10"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>

  <!-- 期刊预设 -->
  <div class="tb-field tb-flex">
    <label>期刊预设</label>
    <select id="sel-preset" class="mini-select"></select>
  </div>

  <!-- 配色 -->
  <div class="tb-field tb-flex">
    <label>配色</label>
    <button class="dropdown-btn" id="btn-palette" type="button">
      <span class="palette-chip" id="palette-chip"></span>
      <span id="palette-label">Okabe-Ito</span>
      <svg class="chev" viewBox="0 0 12 12" width="10" height="10"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>

  <div class="tb-sep"></div>

  <!-- 画布尺寸 -->
  <div class="tb-field tb-size tb-flex">
    <label>画布 (mm)</label>
    <div class="size-box">
      <input type="number" id="inp-w" step="1" min="20" max="600" title="宽度 mm">
      <span>×</span>
      <input type="number" id="inp-h" step="1" min="20" max="600" title="高度 mm">
      <button class="link-btn" id="btn-swap-size" title="交换宽高">⇄</button>
    </div>
  </div>

  <div class="tb-spacer"></div>

  <!-- 撤销重做 -->
  <div class="tb-btnbar tb-flex-none">
    <button class="icon-btn" id="btn-undo" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 20 20" width="16" height="16"><path d="M8 5V2L3 6l5 4V7c3 0 5 1.5 5 4s-2 4-5 4H6v2h2c4 0 7-2.4 7-6s-3-6-7-6z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" title="重做 (Ctrl+Shift+Z)">
      <svg viewBox="0 0 20 20" width="16" height="16"><path d="M12 5V2l5 4-5 4V7c-3 0-5 1.5-5 4s2 4 5 4h2v2h-2c-4 0-7-2.4-7-6s3-6 7-6z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btn-autofit" title="画布自适应窗口">
      <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 3h5v2H5v3H3V3zm9 0h5v5h-2V5h-3V3zM3 12h2v3h3v2H3v-5zm12 0h2v5h-5v-2h3v-3z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="tb-sep"></div>

  <!-- 导出 -->
  <div class="tb-btnbar tb-flex-none">
    <button class="btn btn-primary" id="btn-export">
      <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 2v9m0 0 3.5-3.5M10 11 6.5 7.5M3.5 13v3.5h13V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      导出
      <svg class="chev" viewBox="0 0 12 12" width="10" height="10"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</header>

<!-- ══════════════ 三栏主体 ══════════════ -->
<main class="shell">

  <!-- ── 左：数据集 ── -->
  <aside class="panel panel-left" id="panel-left">
    <div class="panel-head">
      <span class="panel-title">数据表</span>
      <div class="panel-head-actions">
        <button class="icon-btn sm" id="btn-samples" title="载入示例数据">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.4h5.2a2 2 0 0 1 2 2v9.2a1.6 1.6 0 0 0-1.6-1.6H3z"/><path d="M17 4.4h-5.2a2 2 0 0 0-2 2v9.2a1.6 1.6 0 0 1 1.6-1.6H17z"/></svg>
        </button>
        <button class="icon-btn sm" id="btn-new-table" title="新建数据表">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn sm" id="btn-import" title="导入 CSV / TSV">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M3.5 12v4.5h13V12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="icon-btn sm panel-close" id="btn-close-left" title="收起数据表" aria-label="收起数据表">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>

    <div class="ds-tabs" id="ds-tabs"></div>

    <div class="data-area">
      <div class="data-toolbar">
        <select id="sel-sheet-kind" class="mini-select" title="数据表类型"></select>
        <div class="spacer"></div>
        <button class="mini-btn" id="btn-add-col">+ 列</button>
        <button class="mini-btn" id="btn-add-row">+ 行</button>
        <button class="mini-btn" id="btn-del-col">− 列</button>
        <button class="mini-btn" id="btn-del-row">− 行</button>
      </div>

      <div class="data-hint">
        <span class="dh-text" id="dh-text"></span>
      </div>

      <div class="grid-scroll" id="grid-scroll"></div>

      <div class="data-paste" id="data-paste" hidden>
        <textarea id="paste-area" placeholder="从 Excel / Origin / Prism 直接 Ctrl+V 粘贴，或输入 CSV / TSV 文本…&#10;例：&#10;组别	重复1	重复2	重复3&#10;对照	5.2	5.6	5.1&#10;处理	7.8	8.1	7.6"></textarea>
        <div class="data-paste-actions">
          <button class="btn btn-sm" id="btn-paste-cancel">取消</button>
          <button class="btn btn-sm btn-primary" id="btn-paste-ok">解析导入</button>
        </div>
      </div>
    </div>

    <div class="panel-foot">
      <span class="stat-line" id="ds-stat"></span>
      <!-- 表格字体缩放，跟 Excel 一样放在状态栏；也可在表格上 Ctrl+滚轮 / Ctrl+加减号 -->
      <div class="ss-zoom" title="表格字体大小（Ctrl+滚轮 / Ctrl+加号减号）">
        <button class="zoom-btn" id="btn-ss-minus" type="button" title="缩小表格字体" aria-label="缩小表格字体">A−</button>
        <button class="zoom-btn val" id="btn-ss-zoom" type="button" title="表格字体大小">100%</button>
        <button class="zoom-btn" id="btn-ss-plus" type="button" title="放大表格字体" aria-label="放大表格字体">A+</button>
      </div>
    </div>
  </aside>

  <!-- ── 中：画布 ── -->
  <section class="stage">
    <!-- 拖动调整左右面板宽度（双击复位） -->
    <div class="col-resize" id="rs-left" data-resize="left" title="拖动调整数据表宽度 · 双击复位" role="separator" aria-orientation="vertical"></div>
    <div class="col-resize" id="rs-right" data-resize="right" title="拖动调整属性面板宽度 · 双击复位" role="separator" aria-orientation="vertical"></div>
    <div class="stage-toolbar">
      <div class="seg" id="stage-mode">
        <button class="seg-btn on" data-mode="normal">编辑</button>
        <button class="seg-btn" data-mode="pick">元素选择</button>
      </div>
      <span class="hint-inline" id="stage-hint">提示：先渲染，再点“元素选择”挑单个柱子/点/文字改样式</span>
      <div class="spacer"></div>
      <button class="mini-btn" id="btn-fig-title" title="添加 / 编辑图标题（也可直接双击画布上的标题）">标题</button>
      <button class="mini-btn" id="btn-add-annot">+ 标注</button>
      <button class="mini-btn" id="btn-zoom-out">−</button>
      <span class="zoom-val" id="zoom-val">100%</span>
      <button class="mini-btn" id="btn-zoom-in">+</button>
      <button class="mini-btn" id="btn-zoom-reset">适应</button>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <div class="paper" id="paper">
        <div id="chart-host"></div>
        <div id="overlay-host"></div>
      </div>
      <!-- 缩放占位：transform:scale 不会撑大滚动区，靠它把放大后的尺寸算进去 -->
      <div class="paper-shim" id="paper-shim" aria-hidden="true"></div>
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true">
          <path d="M10 52V14M10 52h44" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <rect x="16" y="34" width="8" height="18" rx="1" fill="currentColor" opacity=".3"/>
          <rect x="28" y="24" width="8" height="28" rx="1" fill="currentColor" opacity=".55"/>
          <rect x="40" y="16" width="8" height="36" rx="1" fill="currentColor" opacity=".8"/>
        </svg>
        <p>选择左侧数据表，或从 Excel 粘贴数据开始</p>
      </div>
    </div>

    <div class="statusbar">
      <span id="status-msg">就绪</span>
      <div class="spacer"></div>
      <span class="sb-item" id="sb-render"></span>
      <span class="sb-item" id="sb-size"></span>
    </div>
  </section>

  <!-- ── 右：属性 ── -->
  <aside class="panel panel-right" id="panel-right">
    <div class="panel-tabs" id="right-tabs">
      <button class="ptab on" data-tab="chart">图形</button>
      <button class="ptab" data-tab="style">样式</button>
      <button class="ptab" data-tab="stats">统计</button>
      <button class="ptab" data-tab="elem">元素</button>
      <button class="icon-btn sm panel-close" id="btn-close-right" title="收起属性面板" aria-label="收起属性面板">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <div class="panel-body" id="right-body"></div>
    <div class="panel-foot right-foot">
      <span class="stat-line" id="right-foot-line">—</span>
    </div>
  </aside>
</main>

<!-- ══════════════ 浮层 ══════════════ -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<div class="popmenu" id="popmenu" hidden></div>
<!-- 二级菜单（子菜单） -->
<div class="popmenu popmenu-sub" id="popmenu-sub" hidden></div>
<div class="modal-root" id="modal-root" hidden></div>
<input type="file" id="file-input" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="lib/d3.min.js"></script>
<script src="lib/plot.umd.min.js"></script>
<script src="js/stats.js"></script>
<script src="js/presets.js"></script>
<script src="js/data.js"></script>
<script src="js/grid.js"></script>
<script src="js/chart.js"></script>
<script src="js/export.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
